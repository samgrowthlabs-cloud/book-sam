<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artigo - Enciclopédia Financeira</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/artigo-completo.css">
</head>
<body>
    <!-- Header será injetado automaticamente -->

    <main class="article-container" id="mainArticleContainer">
        <article class="article-full" id="fullArticle">
            <header class="article-header-full" id="articleHeaderFull">
                <div class="article-meta-full">
                    <span class="article-categoria-full" id="articleCategoriaFull">Carregando...</span>
                    <span class="article-data-full" id="articleDataFull">Carregando...</span>
                </div>
                <h1 class="article-title-full" id="articleTitleFull">Carregando artigo...</h1>
                <div class="article-author-full" id="articleAuthorFull">Carregando autor...</div>
            </header>

            <div class="article-content-full" id="articleContentFull">
                <div class="loading-content">
                    <p>Carregando conteúdo do artigo...</p>
                </div>
            </div>

            <footer class="article-footer" id="articleFooterFull">
                <div class="article-actions">
                    <button class="action-btn" onclick="window.print()">
                        📄 Imprimir
                    </button>
                    <button class="action-btn" onclick="compartilharArtigo()">
                        📤 Compartilhar
                    </button>
                    <button class="action-btn" onclick="voltarParaArtigos()">
                        ← Voltar para Artigos
                    </button>
                </div>
            </footer>
        </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/artigo-completo.js"></script>
    <script src="../js/header.js"></script>
</body>
</html>
