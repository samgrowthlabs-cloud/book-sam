<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artigo - Enciclopédia Financeira</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/artigo-completo.css">
    <link rel="stylesheet" href="../css/comentarios.css">
</head>
<body>

    <main class="article-container">
        <article class="article-full">
            <header class="article-header-full">
                <div class="article-meta-full">
                    <span class="article-categoria-full" id="articleCategoria"></span>
                    <span class="article-data-full" id="articleData"></span>
                </div>
                <h1 class="article-title-full" id="articleTitle"></h1>
                <div class="article-author-full" id="articleAuthor"></div>
            </header>

            <div class="article-content-full" id="articleContent">
                <!-- Conteúdo do artigo será inserido aqui -->
            </div>

            <footer class="article-footer">
                <div class="article-actions">
                    <button class="action-btn" onclick="window.print()">
                        📄 Imprimir
                    </button>
                    <button class="action-btn" onclick="compartilharArtigo()">
                        📤 Compartilhar
                    </button>
                    <button class="action-btn" onclick="voltarParaArtigos()">
                        ← Voltar
                    </button>
                </div>
            </footer>
        </article>

                <!-- Seção de Comentários -->
                <section class="comments-section">
                    <div class="comments-header">
                        <h3>💬 Comentários</h3>
                        <span class="comments-count" id="commentsCount">0 comentários</span>
                    </div>

                    <!-- Formulário de Comentário -->
                    <form class="comment-form" id="commentForm">
                        <textarea 
                            id="commentText" 
                            placeholder="Digite seu comentário aqui..."
                            required
                        ></textarea>
                        <div class="comment-form-actions">
                            <button type="submit" class="btn-comment">📤 Publicar Comentário</button>
                        </div>
                    </form>

                    <!-- Lista de Comentários -->
                    <div class="comments-list" id="commentsContainer">
                        <div class="comment-loading">
                            <p>Carregando comentários...</p>
                        </div>
                    </div>
                </section>
            </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/artigo-completo.js"></script>
    <script src="../js/comentarios.js"></script>
    <script src="../js/header.js"></script>

    
</body>
</html>
